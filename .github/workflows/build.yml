name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Check for an existing release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            let published = false;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: '1.0.1'
              });
              published = !data.draft;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!published) {
              let tagExists = false;
              try {
                await github.rest.git.getRef({
                  ...context.repo,
                  ref: 'tags/1.0.1'
                });
                tagExists = true;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (tagExists) {
                const { data: taggedCommit } = await github.rest.repos.getCommit({
                  ...context.repo,
                  ref: '1.0.1'
                });
                if (taggedCommit.sha !== context.sha) {
                  throw new Error('Tag 1.0.1 already points to a different commit');
                }
              }
            }
            core.setOutput('published', String(published));

      - name: Upload release JAR
        if: steps.release.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: '1.0.1'
          name: '1.0.1'
          target_commitish: ${{ github.sha }}
          draft: true
          files: build/libs/fmcraft-1.0.1.jar
          fail_on_unmatched_files: true

      - name: Publish release
        if: steps.release.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: '1.0.1'
          draft: false